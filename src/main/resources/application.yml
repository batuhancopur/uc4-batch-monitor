spring:
  application:
    name: uc4-batch-monitor
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true
  datasource:
    target:
      url: ${TARGET_DB_URL:jdbc:oracle:thin:@//localhost:1521/REPORTDB}
      username: ${TARGET_DB_USERNAME:uc4_monitor}
      password: ${TARGET_DB_PASSWORD:uc4_monitor}
      driver-class-name: ${TARGET_DB_DRIVER:oracle.jdbc.OracleDriver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

uc4:
  datasource:
    url: ${UC4_DB_URL:jdbc:oracle:thin:@//localhost:1521/UC4}
    username: ${UC4_DB_USERNAME:uc4}
    password: ${UC4_DB_PASSWORD:uc4}
    driver-class-name: ${UC4_DB_DRIVER:oracle.jdbc.OracleDriver}
  team-code: ${UC4_TEAM_CODE:TEAM}
  lookback-days: ${UC4_LOOKBACK_DAYS:30}
  sync:
    # Adjust these SQL files to your Automic version/schema. The application depends on the aliases only.
    definition-query-location: classpath:sql/uc4-job-definitions.sql
    run-history-query-location: classpath:sql/uc4-run-history.sql

uc4-anomaly:
  lookback-days: ${ANOMALY_LOOKBACK_DAYS:30}
  duration-threshold-percent: ${ANOMALY_DURATION_THRESHOLD_PERCENT:40}
  minimum-baseline-runs: ${ANOMALY_MIN_BASELINE_RUNS:5}
  detect-missing-runs: ${ANOMALY_DETECT_MISSING_RUNS:false}

uc4-report:
  from: ${REPORT_MAIL_FROM:uc4-monitor@example.com}
  recipients: ${REPORT_MAIL_RECIPIENTS:team@example.com}
  subject-prefix: ${REPORT_MAIL_SUBJECT_PREFIX:[UC4]}
